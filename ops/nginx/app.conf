server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing here is meant to be framed by another site (clickjacking), sniffed
    # into another type, or to tell other sites which page a learner was on.
    # The microphone is for this origin only. The CSP sets only what cannot
    # break a page: where scripts and media load from is left to a later,
    # tested policy.
    #
    # nginx drops these in any location that sets add_header of its own, which
    # is why the asset rule below repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # The admin console: a separate build under /admin/, on the same origin as
    # the app, because the session cookie has no Domain and the API allows
    # exactly one CORS origin.
    #
    # Its own fallback, or /admin/clips on a cold load would fall through to the
    # learner app's index and boot the wrong bundle. The asset rule further down
    # is a regex, so it still wins for /admin/assets/*.js — and that is right:
    # those files are on disk at exactly that path, and a missing one should 404
    # rather than come back as HTML.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # The console without its slash, which the fallback below would otherwise
    # hand to the learner app. Relative, so behind the host's https nginx it
    # stays https (this server only ever sees plain http on port 80).
    absolute_redirect off;
    location = /admin {
        return 301 /admin/;
    }

    # SPA: unknown paths fall back to index so client routing works.
    #
    # No `$uri/`: a route can share its name with a folder of pictures —
    # /login and public/login/ — and with `$uri/` nginx answered /login with
    # a redirect to /login/, then 403 for a folder with no index. Nothing
    # under / is meant to be a directory page; / itself falls back to index.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }
}
