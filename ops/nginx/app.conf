server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The admin console: a separate build under /admin/, on the same origin as
    # the app, because the session cookie has no Domain and the API allows
    # exactly one CORS origin.
    #
    # Its own fallback, or /admin/clips on a cold load would fall through to the
    # learner app's index and boot the wrong bundle. The asset rule further down
    # is a regex, so it still wins for /admin/assets/*.js — and that is right:
    # those files are on disk at exactly that path, and a missing one should 404
    # rather than come back as HTML.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA: unknown paths fall back to index so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
