# Host nginx: TLS + reverse proxy for Shadowline + Jenkins.
#
# Install on the VPS (Debian/Ubuntu sketch):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp ops/nginx/vhost.example.conf /etc/nginx/sites-available/shadowline
#   # edit server_name, then:
#   sudo ln -sf /etc/nginx/sites-available/shadowline /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shadowline.example.com -d ci.example.com
#
# The landing page (the bare domain, example.com) is static files from the
# deploy checkout's landing/ directory, which every main deploy rsyncs into
# /opt/shadowline — nginx serves them straight off disk, no container.
#
# Upstream ports are server/docker-compose.prod.yml's, all on 127.0.0.1:
#   API :8090   SPA (web) :8088   Keycloak :8081   Jenkins :8085   Grafana :3000
# (Grafana's 3000 is often taken on a shared host; change it in
# ops/observability/docker-compose.yml and here together.)
#
# Replace example.com hostnames before enabling. A host whose nginx already
# serves other sites: add these server blocks beside them; nothing here is a
# default_server.

# --- Landing page (example.com, www.example.com) -----------------------------
# The public home page Google's OAuth verification reads: what Shadowline is,
# before any login. The app itself stays on shadowline.example.com.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/shadowline/landing;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pictures change rarely and are small; the page and its CSS/JS change with
    # each deploy, so they are revalidated rather than cached for days.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}

# --- App + API (same origin) -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shadowline.example.com;

    # Certbot will rewrite this block for HTTPS after first run.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shadowline.example.com;

    # Filled by certbot, or point at your own certs:
    # ssl_certificate     /etc/letsencrypt/live/shadowline.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shadowline.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    # Once https works, keep browsers on it. Uncomment after the certificate is
    # in place: a browser that has seen this will refuse http for a year.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Go API (and auth / health / file streams)
    location /api/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
    }

    location /files/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vite SPA (Compose service `web`)
    location / {
        proxy_pass         http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# --- Keycloak (email / password sign-in) --------------------------------------
# KEYCLOAK_PUBLIC_URL. The sign-in, registration and reset pages are Keycloak's,
# so the browser comes here; the API reaches Keycloak inside Docker instead.
server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.example.com;

    # ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    # The admin console is not for the internet: reach it through
    # `ssh -L 8081:127.0.0.1:8081 <server>` and http://localhost:8081/admin/.
    location /admin/ {
        return 404;
    }

    # Keycloak sends its bare root to the admin console, whose address is
    # KC_HOSTNAME_ADMIN — http://localhost:8081, the tunnel's end, which in a
    # visitor's browser is their own machine. Send them to their account.
    location = / {
        return 302 /realms/shadowline/account/;
    }

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        # Keycloak's pages carry big cookies and headers.
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }
}

# --- Jenkins UI --------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ci.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ci.example.com;

    # ssl_certificate     /etc/letsencrypt/live/ci.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ci.example.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Jenkins uses chunked / long-lived responses for the console.
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_set_header   Connection        "";
    }
}

# --- Grafana (logs / metrics / traces) ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.example.com;

    # ssl_certificate     /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;

    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
