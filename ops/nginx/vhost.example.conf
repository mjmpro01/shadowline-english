# Host nginx: TLS + reverse proxy for Shadowline + Jenkins.
#
# Install on the VPS (Debian/Ubuntu sketch):
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp ops/nginx/vhost.example.conf /etc/nginx/sites-available/shadowline
#   # edit server_name, then:
#   sudo ln -sf /etc/nginx/sites-available/shadowline /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shadowline.example.com -d ci.example.com
#
# Upstream ports match docker-compose publish mappings:
#   API  :8080   SPA (web) :8088   Jenkins :8085
#
# Replace example.com hostnames before enabling.

# --- App + API (same origin) -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shadowline.example.com;

    # Certbot will rewrite this block for HTTPS after first run.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shadowline.example.com;

    # Filled by certbot, or point at your own certs:
    # ssl_certificate     /etc/letsencrypt/live/shadowline.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shadowline.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Go API (and auth / health / file streams)
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
    }

    location /files/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vite SPA (Compose service `web`)
    location / {
        proxy_pass         http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# --- Jenkins UI --------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ci.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ci.example.com;

    # ssl_certificate     /etc/letsencrypt/live/ci.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ci.example.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Jenkins uses chunked / long-lived responses for the console.
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_set_header   Connection        "";
    }
}
