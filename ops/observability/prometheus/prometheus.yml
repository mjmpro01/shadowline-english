global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alloy also remote-writes app metrics; this scrape is a fallback for /metrics.
  - job_name: shadowline-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: shadowline-api
