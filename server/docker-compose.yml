# Everything the backend needs on one machine. `docker compose up` after copying
# .env.example to .env and filling it in.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadowline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shadowline
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowline"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    env_file: .env
    environment:
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Publishes the starter library once, so the first screen is not empty. It
  # exits immediately if the library already has clips, so leaving it in the
  # default set is harmless.
  seed:
    build:
      context: .
    env_file: .env
    entrypoint: ["/usr/local/bin/seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scoring:
    build:
      context: ../scoring
    env_file: .env
    # The worker is the part that scales: one replica scores roughly one take a
    # second, so add replicas until the queue stops growing.
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
