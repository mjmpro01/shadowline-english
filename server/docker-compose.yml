# Everything the backend needs on one machine. `docker compose up` after copying
# .env.example to .env and filling it in.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadowline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shadowline
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `keycloak` database on first boot of an empty volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Also ensure the Keycloak database exists — init scripts only run on an
      # empty volume, and an older install already has pgdata without it.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U shadowline && psql -U shadowline -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'keycloak'\" | grep -q 1 || psql -U shadowline -d postgres -c 'CREATE DATABASE keycloak'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP (Keycloak → here)
      - "8025:8025"   # web UI to read reset-password mail

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: shadowline
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Lets the React app (localhost:5173) fetch presigned video/audio. Without
      # this the player gets a URL and paints a black frame at 0:00.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    env_file: .env
    environment:
      ADDR: ":8080"
      # Inside the compose network the API talks to Keycloak by service name;
      # KEYCLOAK_PUBLIC_URL (in .env) is what the browser uses.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Publishes the starter library once, so the first screen is not empty. It
  # exits immediately if the library already has clips, so leaving it in the
  # default set is harmless.
  seed:
    build:
      context: .
    env_file: .env
    entrypoint: ["/usr/local/bin/seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scoring:
    build:
      context: ../scoring
    env_file: .env
    # The worker is the part that scales: one replica scores roughly one take a
    # second, so add replicas until the queue stops growing.
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Cuts each published clip's video out of the file it came from. A separate
  # service from scoring, and the same image with a different entrypoint: a
  # learner waits on a score, nobody waits on a cut, and one cut holds a CPU for
  # seconds. Sharing a worker would put a batch of cuts in front of the score
  # somebody is watching for.
  cutting:
    build:
      context: ../scoring
    entrypoint: ["python", "-m", "shadowline.cutter"]
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Muxes a learner's recording onto the clip's picture, on request. Its own
  # service because it is the one piece of queued work somebody is sitting in
  # front of waiting for — a batch of cuts running ahead of it would make them
  # wait minutes for sub-second work.
  dubbing:
    build:
      context: ../scoring
    entrypoint: ["python", "-m", "shadowline.dubber"]
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Runs Whisper over each upload and stores the words with their times and
  # their IPA, so the studio fills its own lines in. The third worker and the
  # third queue: a learner waits on a score in seconds, nobody waits on a cut,
  # and an admin watches a transcript arrive over minutes.
  transcribing:
    build:
      context: ../scoring
    entrypoint: ["python", "-m", "shadowline.transcriber"]
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Looks up what a tapped word means, once per word ever. The fifth queue, and
  # the only one whose cost is a network allowance rather than CPU: the
  # pronunciation comes from CMUdict and is free, the meaning comes from
  # Merriam-Webster and then, for what they do not have, the Claude API. Its
  # own service for the same reason as dubbing — a learner has tapped a word
  # and a popup is waiting on it.
  #
  # Runs with neither key set. Words then come back with a pronunciation and no
  # meaning, which is a smaller answer rather than a broken one.
  glossing:
    build:
      context: ../scoring
    entrypoint: ["python", "-m", "shadowline.glosser"]
    env_file: .env
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
