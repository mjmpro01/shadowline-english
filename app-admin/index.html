<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The theme chosen in the learner app (same origin, same storage), before
         the first paint. The same rule as src/lib/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('shadowline.theme')
        if (theme === 'system')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <!-- No manifest and no service worker: this is a console somebody opens at
         a desk, not something to install on a phone. -->
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <title>Shadowline console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
